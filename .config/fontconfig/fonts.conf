<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- الخطوط بدون زوائد (Sans-serif) للواجهات والويب -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic</family>
      <family>IBM Plex Sans Arabic</family>
    </prefer>
  </alias>

  <!-- الخطوط ذات الزوائد (Serif) -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>

  <!-- خطوط البرمجة والطرفية (Monospace) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>
<!-- إبعاد خطوط النستعليق عن الخيار الافتراضي -->
  <selectconfig>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Noto Nastaliq Urdu</string></patelt>
      </pattern>
    </rejectfont>
  </selectconfig>
</fontconfig>
