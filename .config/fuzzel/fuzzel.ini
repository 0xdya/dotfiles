include=~/.config/fuzzel/themes/noctalia

[main]
font=JetBrains Mono:size=13
line-height=22

prompt="❯ "
placeholder="search..."
dpi-aware=yes

width=35
lines=10

horizontal-pad=20
vertical-pad=14
inner-pad=10

border-size=2
border-radius=10

use-bold=yes
match-mode=fuzzy


[colors]
background=0c0c0cCC
text=ffffffff

prompt=99ffe4ff
placeholder=fbadffff
input=ffc799ff
match=fbadffff

selection=ffc79980
selection-text=ffffffff
selection-match=000000ff

counter=99ffe4ff
border=ffc799ff